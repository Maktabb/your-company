<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-180.png">
<style>html{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script src="config.js"></script>
<title>بوابة العملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: iOS messenger — large-title list beside one conversation; Liquid-Glass header, floating tab bar and composer over the scrolling thread */
:root{
  --bg:#f2f2f7; --bg-a:#d9e6ff; --bg-b:#efe3ff; --bg-c:#dff6f0; --wall:#ffffff;
  --surface:#ffffff; --surface-2:#f2f2f7; --fill:rgba(120,120,128,.12); --seg-on:#ffffff;
  --ink:#000000; --muted:rgba(60,60,67,.62); --line:rgba(60,60,67,.18);
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.80); --glass-line:rgba(255,255,255,.75);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 .5px rgba(255,255,255,.5),0 10px 30px rgba(15,25,60,.10),0 1px 2px rgba(15,25,60,.06);
  --navy:#007aff; --navy-2:#3d9bff; --on-navy:#ffffff;
  --gold:#007aff; --gold-2:#4ea3ff; --gold-ink:#0062cc; --gold-soft:rgba(0,122,255,.12); --on-gold:#ffffff;
  --brand:#c9a23a; --brand-bg:#13284f;
  --out:#007aff; --out-ink:#ffffff; --in:#e9e9eb; --internal:#fff2c2; --sys:rgba(118,118,128,.12);
  --ok:#248a3d; --ok-bg:rgba(52,199,89,.16); --warn:#c93400; --warn-bg:rgba(255,149,0,.16);
  --bad:#d70015; --bad-bg:rgba(255,59,48,.12); --info:#0062cc; --info-bg:rgba(0,122,255,.12); --switch:#34c759;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Arabic","SF Arabic","SF Pro Text","IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --f-head:-apple-system,BlinkMacSystemFont,"SF Pro Arabic","SF Arabic","SF Pro Display","IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --r-lg:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --bg-a:#0b1d44; --bg-b:#241040; --bg-c:#062a26; --wall:#000000;
  --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(120,120,128,.24); --seg-on:#636366;
  --ink:#ffffff; --muted:rgba(235,235,245,.62); --line:rgba(84,84,88,.55);
  --glass:rgba(28,28,30,.55); --glass-2:rgba(44,44,46,.72); --glass-line:rgba(255,255,255,.12);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 .5px rgba(255,255,255,.08),0 12px 34px rgba(0,0,0,.55);
  --navy:#0a84ff; --navy-2:#409cff; --on-navy:#ffffff;
  --gold:#0a84ff; --gold-2:#5eb0ff; --gold-ink:#64aaff; --gold-soft:rgba(10,132,255,.22); --on-gold:#ffffff;
  --brand:#e0bd62; --brand-bg:#1b3264;
  --out:#0a84ff; --out-ink:#ffffff; --in:#262629; --internal:#3a3214; --sys:rgba(118,118,128,.26);
  --ok:#30d158; --ok-bg:rgba(48,209,88,.18); --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.18);
  --bad:#ff453a; --bad-bg:rgba(255,69,58,.18); --info:#64aaff; --info-bg:rgba(10,132,255,.2); --switch:#30d158; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#000000; --bg-a:#0b1d44; --bg-b:#241040; --bg-c:#062a26; --wall:#000000;
  --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(120,120,128,.24); --seg-on:#636366;
  --ink:#ffffff; --muted:rgba(235,235,245,.62); --line:rgba(84,84,88,.55);
  --glass:rgba(28,28,30,.55); --glass-2:rgba(44,44,46,.72); --glass-line:rgba(255,255,255,.12);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 .5px rgba(255,255,255,.08),0 12px 34px rgba(0,0,0,.55);
  --navy:#0a84ff; --navy-2:#409cff; --on-navy:#ffffff;
  --gold:#0a84ff; --gold-2:#5eb0ff; --gold-ink:#64aaff; --gold-soft:rgba(10,132,255,.22); --on-gold:#ffffff;
  --brand:#e0bd62; --brand-bg:#1b3264;
  --out:#0a84ff; --out-ink:#ffffff; --in:#262629; --internal:#3a3214; --sys:rgba(118,118,128,.26);
  --ok:#30d158; --ok-bg:rgba(48,209,88,.18); --warn:#ff9f0a; --warn-bg:rgba(255,159,10,.18);
  --bad:#ff453a; --bad-bg:rgba(255,69,58,.18); --info:#64aaff; --info-bg:rgba(10,132,255,.2); --switch:#30d158; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  background-image:radial-gradient(70vw 55vh at 100% 0%,var(--bg-a),transparent 70%),radial-gradient(60vw 50vh at 0% 100%,var(--bg-b),transparent 70%),radial-gradient(40vw 40vh at 0% 0%,var(--bg-c),transparent 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.25;font-weight:700;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border:.5px solid var(--glass-line);box-shadow:var(--glass-shadow)}

#root{height:100%;display:flex;flex-direction:column}
.demo{flex:none;background:var(--gold-soft);color:var(--gold-ink);font-size:12.5px}
.demo>div{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:6px}
#app{flex:1;min-height:0;display:flex}

/* controls */
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap;transition:background .2s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.ib{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:.5px solid var(--glass-line);background:var(--glass-2);color:var(--gold);box-shadow:var(--glass-shadow);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .15s;text-decoration:none}
.ib:active{transform:scale(.9)}
.ib svg{width:20px;height:20px}
.ib.gold{background:var(--gold);color:var(--on-gold);border-color:transparent;box-shadow:0 4px 14px rgba(0,122,255,.35)}
.ib.wa{color:#25d366}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--fill);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--gold);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.8}
.btn.primary,.btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:wait}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500;padding-inline-start:4px}
.inp{width:100%;background:var(--fill);border:1.5px solid transparent;border-radius:12px;padding:10px 14px;font-size:16px}
.inp:focus{outline:none;border-color:var(--gold);background:var(--surface)}
textarea.inp{resize:none;min-height:42px}
select.inp{appearance:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)}
.c-info{background:var(--info-bg);color:var(--info)} .c-mute{background:var(--fill);color:var(--muted)} .c-gold{background:var(--gold-soft);color:var(--gold-ink)}
.av{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:600;font-size:19px;color:#fff;background:linear-gradient(180deg,#a5abb8,#858b98)}
.av.s{width:38px;height:38px;font-size:15px}
.av.brand{background:linear-gradient(160deg,var(--brand-bg),#0a1630);color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}

/* gate (login) */
.gate{margin:auto;width:min(420px,100%);padding-block:20px}
.gate .card{border-radius:30px;padding:30px 24px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.gate .av{width:72px;height:72px;font-size:22px;margin:0 auto}
.codein{letter-spacing:5px;text-align:center;font-size:24px;font-weight:700;direction:ltr;text-transform:uppercase}
.err{color:var(--bad);font-size:14px;min-height:1.2em}

/* side list */
.side{width:380px;flex:none;display:flex;flex-direction:column;min-height:0;border-inline-end:.5px solid var(--line);background:var(--glass)}
.side-h{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-radius:0;border-width:0 0 .5px;box-shadow:none}
.side-h .top{display:flex;align-items:center;gap:8px}
.side-h h1{font-size:30px;flex:1;min-width:0}
.search{border-radius:12px;background:var(--fill);padding:8px 14px;font-size:16px;border:0}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters button{flex:none;border:0;background:var(--fill);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.list{flex:1;overflow-y:auto;min-height:0;padding-block:4px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:start;border:0;background:transparent;padding-block:9px;cursor:pointer;position:relative}
.item::after{content:"";position:absolute;bottom:0;inset-inline-start:calc(16px + 62px);inset-inline-end:0;border-bottom:.5px solid var(--line)}
.item:hover,.item.on{background:var(--fill)}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
.item .nm{font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pv{font-size:14.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pg{font-size:12.5px;color:var(--gold-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:13px;color:var(--muted);flex:none;align-self:flex-start;padding-top:2px}
.badge{min-width:21px;height:21px;padding:0 6px;border-radius:99px;background:var(--gold);color:var(--on-gold);font-size:12.5px;font-weight:700;display:inline-grid;place-items:center}
.empty{padding:22px 16px;color:var(--muted);font-size:15px;text-align:center}

/* conversation */
.conv{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;--top:120px;--bot:0px;--tabh:0px}
.scroll{position:absolute;inset:0;overflow-y:auto;background:var(--wall);overscroll-behavior:contain}
.inner{max-width:860px;margin:0 auto;padding-top:calc(var(--top) + 12px);padding-bottom:calc(var(--bot) + 18px);min-height:100%;display:flex;flex-direction:column;gap:14px}
.chead{position:absolute;inset:0 0 auto;z-index:5;border-width:0 0 .5px;border-radius:0;padding-block:9px;box-shadow:none}
.chead .r1{display:flex;align-items:center;gap:10px;max-width:860px;margin:0 auto}
.chead .ttl{flex:1;min-width:0;text-align:start}
.chead .ttl b{display:block;font-family:var(--f-head);font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .ttl span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.placeholder{margin:auto;text-align:center;color:var(--muted);padding:30px}
.back{display:none}

/* floating tab bar */
.tabbar{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:5px;border-radius:32px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
.tabbar button{flex:1 0 auto;min-width:60px;border:0;background:transparent;border-radius:26px;padding:6px 10px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);font-size:10.5px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.tabbar button[aria-selected="true"]{color:var(--gold);background:var(--fill)}
.tabbar .ti{position:relative;display:grid;place-items:center;height:26px}
.tabbar svg{width:24px;height:24px}
.tabbar .dot{position:absolute;top:-3px;inset-inline-end:-12px}

/* chat */
.chan{position:sticky;top:calc(var(--top) + 8px);z-index:3;align-self:center;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.day,.sys{align-self:center;color:var(--muted);font-size:12px;font-weight:600;padding:2px 12px;max-width:92%;text-align:center}
.sys{background:var(--sys);border-radius:14px;font-weight:500;padding:5px 12px}
.msgs{display:flex;flex-direction:column;gap:3px;flex:1;justify-content:flex-end}
.msg{max-width:min(78%,520px);padding:7px 13px 5px;border-radius:20px;background:var(--in);align-self:flex-start;min-width:0;color:var(--ink)}
.msg.me{background:var(--out);color:var(--out-ink);align-self:flex-end}
.internal .msg{background:var(--internal);color:var(--ink)} .internal .msg.me{background:#ffd60a;color:#1c1c1e}
.msg .who{font-size:12.5px;font-weight:600;color:var(--gold-ink)}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.4}
.msg .tm{font-size:11px;opacity:.65;display:flex;gap:3px;align-items:center;justify-content:flex-end;direction:ltr;margin-top:1px}
.tm svg{width:16px;height:12px}
.tm .seen{display:inline-flex;opacity:1}
.msg.me .tm{opacity:.8}
.msg.gap{margin-top:8px}
.msg.pending{opacity:.6}
.att{display:flex;align-items:center;gap:10px;background:rgba(127,127,140,.16);border:0;border-radius:14px;padding:8px 10px;margin:2px 0 3px;font-size:14px;cursor:pointer;width:100%;text-align:start;color:inherit;min-width:0}
.msg.me .att{background:rgba(255,255,255,.2)}
.att .ext{flex:none}
.att span{overflow-wrap:anywhere;min-width:0}
.ext{width:36px;height:44px;border-radius:7px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;background:linear-gradient(180deg,#5aa9ff,#007aff)}
.composer{position:absolute;z-index:5;left:0;right:0;bottom:var(--tabh);padding-block:6px;background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.composer>div{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border-radius:22px;max-height:130px;padding:9px 16px;background:var(--glass-2);border:.5px solid var(--glass-line);box-shadow:var(--glass-shadow);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%)}
.note-int{align-self:center;font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:3px 13px}

/* grouped cards */
.card{border-radius:var(--r-lg);overflow:hidden}
.card.glass{background:var(--glass-2)}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px 8px}
.card-h h2{font-size:17px}
.pad{padding:14px 16px}
.rowi{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 16px;position:relative;flex-wrap:wrap}
.rowi::before,.steps li::before,.doc::before,.partner::before,.namerow::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;border-top:.5px solid var(--line)}
.rowi .t{flex:1;min-width:170px}
.rowi.need{background:var(--warn-bg)}
.addform{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:.5px solid var(--line)}
.addform .inp{flex:1;min-width:150px}
.track{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.5px;background:var(--line)}
.stage{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;background:var(--glass-2)}
.stage .sn{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;background:var(--fill);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s}
.stage.done .bar i{background:var(--switch)}
.toggles{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px;border-top:.5px solid var(--line)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;user-select:none}
.toggle input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--fill);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.toggle input::before{content:"";position:absolute;top:2px;inset-inline-start:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked{background:var(--switch)}
.toggle input:checked::before{transform:translateX(-18px)}
[dir="ltr"] .toggle input:checked::before{transform:translateX(18px)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;position:relative}
.steps .sl{font-size:12.5px;font-weight:600;color:var(--muted);background:transparent;padding:14px 16px 4px;text-transform:none}
.steps .sl::before{display:none}
.mark{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;background:transparent;color:transparent;padding:0}
.mark.done{background:var(--switch);border-color:var(--switch);color:#fff}
.mark.doing{border-color:var(--gold);box-shadow:inset 0 0 0 4px var(--surface);background:var(--gold)}
button.mark{cursor:pointer}
.st-t.doing{font-weight:700}
.st-m{font-size:12.5px;color:var(--muted)}
.partner{display:grid;grid-template-columns:2fr 1fr .8fr 1.2fr auto;gap:8px;align-items:end;padding:10px 16px;position:relative}
@media (max-width:640px){.partner{grid-template-columns:1fr 1fr}.partner .f-name{grid-column:1/-1}}
.namerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;position:relative}
.namerow .inp{flex:1;min-width:140px}
.savebar{position:sticky;bottom:calc(var(--bot) + 12px);display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:999px;padding:8px 8px 8px 18px;z-index:2}
.doc{display:flex;gap:12px;align-items:center;padding:11px 16px;position:relative}
.doc .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.5px;background:var(--line)}
.stat{background:var(--glass-2);padding:12px 16px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-head);font-size:22px;font-weight:700;line-height:1.4}
.secret{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
details.danger{border-top:.5px solid var(--line);padding-top:10px}
details.danger summary{color:var(--bad);font-weight:600;cursor:pointer;font-size:15px}
details.danger form{margin-top:10px;display:flex;flex-direction:column;gap:8px}

/* sheets (dialogs) */
dialog{border:.5px solid var(--glass-line);border-radius:30px;padding:0;background:var(--glass-2);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100% - 24px);box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-h{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-h h2{font-size:19px}
.dlg-b{padding:6px 18px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:64vh}
.dlg-f{padding:10px 18px 18px;display:flex;gap:8px;flex-wrap:wrap}
.dlg-f .btn{flex:1}
.invite{background:var(--fill);border-radius:14px;padding:10px 12px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.bigcode{font-size:24px;font-weight:700;letter-spacing:4px;direction:ltr;font-variant-numeric:tabular-nums;color:var(--gold-ink);font-family:ui-monospace,"SF Mono",Menlo,monospace}
.qcard{background:var(--fill);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.coderow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:.5px solid var(--line)}
.coderow:first-child{border-top:0}
.coderow .t{flex:1;min-width:0}

.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:80;max-width:calc(100vw - 32px);text-align:center}
.sk{border-radius:18px;height:52px;background:linear-gradient(90deg,var(--fill) 25%,var(--surface-2) 50%,var(--fill) 75%);background-size:200% 100%}

@media (max-width:860px){
  .side{width:100%;border:0}
  .app-team .conv{display:none}
  .app-team.in-conv .side{display:none}
  .app-team.in-conv .conv{display:flex}
  .back{display:grid}
  .tabbar button{min-width:52px;padding:6px 6px 5px}
}
@media (prefers-reduced-motion:no-preference){
  .msg.new,.sys.new{animation:pop .28s cubic-bezier(.2,.9,.3,1.25)}
  @keyframes pop{from{transform:translateY(10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .sk{animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}
  dialog[open]{animation:up .3s cubic-bezier(.2,.9,.3,1.1)}@keyframes up{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:none;opacity:1}}
}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,label,.item,.tabbar button{touch-action:manipulation}
#root{min-height:0}
@media (max-width:430px){.chead .r1>.chip{display:none}}
.kb .tabbar{display:none}
.steps-i{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;line-height:1.6}
.steps-i svg{width:18px;height:18px;vertical-align:-3px;color:var(--gold)}
@media (max-width:860px){.side-h .top .ib{width:36px;height:36px}.side-h h1{font-size:26px}}
</style>

<body>
<div id="root"><div id="demo"></div><div id="app"></div></div>
<div id="toast" class="toast glass" hidden></div>

<script>
/* ===== منطق البوابة المشترك (يعمل على الخادم وفي المعاينة) ===== */

/* رمز دخول العميل: أول حرف من الاسم بالإنجليزية (كبير) + آخر ٦ أرقام من الهاتف */
function portalCode(name, phone, letter) {
  var MAP = { 'ا': 'A', 'أ': 'A', 'إ': 'E', 'آ': 'A', 'ع': 'A', 'ب': 'B', 'ت': 'T', 'ط': 'T', 'ث': 'T', 'ج': 'G', 'غ': 'G', 'ح': 'H', 'ه': 'H', 'ة': 'H', 'خ': 'K', 'ك': 'K', 'ق': 'K',
    'د': 'D', 'ض': 'D', 'ذ': 'Z', 'ز': 'Z', 'ظ': 'Z', 'ر': 'R', 'س': 'S', 'ص': 'S', 'ش': 'S', 'ف': 'F', 'ل': 'L', 'م': 'M', 'ن': 'N', 'و': 'W', 'ي': 'Y', 'ى': 'Y' };
  var d = String(phone || '').replace(/[٠-٩]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); }).replace(/\D/g, '');
  var L = String(letter || '').toUpperCase().replace(/[^A-Z]/g, '').charAt(0);
  if (!L) {
    var n = String(name || '').trim().replace(/^(أ\/|ا\/|م\/|د\/|السيد|الأستاذ|الاستاذ|استاذ|أستاذ)\s*/, '');
    var c = n.charAt(0);
    L = /[a-z]/i.test(c) ? c.toUpperCase() : (MAP[c] || '');
  }
  if (!L || d.length < 6) return '';
  return L + d.slice(-6);
}

function makeCore(store, drive, util, quotes, journal) {
  var STAGES = [
    { key: 'gafi', label: 'الهيئة العامة للاستثمار', hint: 'حتى صدور السجل التجاري' },
    { key: 'tax', label: 'الضرائب', hint: 'البطاقة الضريبية وما يليها' },
    { key: 'post', label: 'خدمات ما بعد التأسيس', hint: 'التراخيص والتسجيلات الإضافية' }
  ];
  var TEMPLATES = {
    formation: {
      steps: [
        ['gafi', 'استلام بيانات الشركاء والمستندات'],
        ['gafi', 'اعتماد الاسم التجاري'],
        ['gafi', 'شهادة إيداع رأس المال من البنك'],
        ['gafi', 'مراجعة العقد وتوقيعه'],
        ['gafi', 'صدور السجل التجاري'],
        ['tax', 'استخراج البطاقة الضريبية'],
        ['tax', 'التسجيل في منظومة الفاتورة الإلكترونية']
      ],
      reqs: [
        ['صور بطاقات الرقم القومي أو جوازات السفر لجميع الشركاء', 'client'],
        ['تحديد النشاط واقتراح ثلاثة أسماء تجارية على الأقل', 'client'],
        ['عقد إيجار المقر أو سند الحيازة', 'client']
      ]
    },
    other: {
      steps: [
        ['gafi', 'استلام الطلب والمستندات'],
        ['gafi', 'تقديم الطلب للجهة المختصة'],
        ['gafi', 'صدور المستخرج أو القرار']
      ],
      reqs: [['المستندات المطلوبة للخدمة', 'client']]
    }
  };
  var STEP_ST = ['لم تبدأ', 'جارية', 'تمت'];
  var REQ_ST = ['مفتوح', 'جارٍ التنفيذ', 'تم'];
  var NAME_ST = ['قيد المراجعة', 'مقبول', 'مرفوض'];
  var MAX_FAILS = 5, LOCK_SEC = 900, MAX_B64 = 14200000;
  var cache = util.cache, curRole = '';

  function T(v) { return v === true || v === 'true' || v === 'TRUE'; }
  function N(v) { return Number(v) || 0; }
  function S(v, max) { return String(v == null ? '' : v).trim().slice(0, max || 500); }
  function digits(v) {
    return String(v || '').replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
      .replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); }).replace(/\D/g, '');
  }
  function normCode(v) {
    return String(v || '').replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 20);
  }
  function byOrder(a, b) { return N(a.order) - N(b.order); }
  function byTs(a, b) { return N(a.ts) - N(b.ts); }
  function stageLabel(k) { for (var i = 0; i < STAGES.length; i++) if (STAGES[i].key === k) return STAGES[i].label; return k; }

  /* ---------- الحماية: إيقاف المحاولات المتكررة ---------- */
  function fails(k) { return N(cache.get('f_' + k)); }
  function guard(k) { if (fails(k) >= MAX_FAILS) throw new Error('تم إيقاف المحاولات مؤقتًا لحماية الملف. يُرجى المحاولة بعد ١٥ دقيقة أو التواصل مع المكتب.'); }
  function fail(k) { cache.put('f_' + k, String(fails(k) + 1), LOCK_SEC); }

  function emptyData() { return { form: '', activity: '', capital: '', address: '', nameEn: '', partners: [], names: [] }; }
  function readData(f) {
    try { var d = f.data ? JSON.parse(f.data) : null; return d ? Object.assign(emptyData(), d) : emptyData(); }
    catch (e) { return emptyData(); }
  }
  function touch(id) {
    var now = util.now();
    store.patch('files', id, { updated: now });
    cache.put('s_' + id, String(now), 21600);
    cache.put('ls', String(now), 21600);
  }

  function fileForClient(p) {
    var t = S(p.token, 80), code = normCode(p.code);
    if (!t) throw new Error('الرابط غير صالح.');
    guard('c' + t);
    var f = store.rows('files').filter(function (r) { return r.token === t; })[0];
    if (!f || !code || normCode(f.code) !== code) { fail('c' + t); throw new Error('رمز الدخول غير صحيح. يُرجى التأكد من الرمز المرسل من المكتب.'); }
    cache.put('a_' + t + '_' + code, f.id, 600);
    return f;
  }
  function member(p) {
    var name = S(p.tname, 80), code = normCode(p.tcode);
    if (!name) throw new Error('الاسم أو الرمز غير صحيح.');
    guard('t' + name);
    var m = store.rows('team').filter(function (r) { return r.name === name && normCode(r.code) === code; })[0];
    if (!m || !code) { fail('t' + name); throw new Error('الاسم أو الرمز غير صحيح.'); }
    cache.put('m_' + name + '_' + code, '1', 600);
    curRole = m.role;
    return m;
  }
  function memberFast(p) {
    if (cache.get('m_' + S(p.tname, 80) + '_' + normCode(p.tcode))) return true;
    member(p); return true;
  }
  function fileById(id) {
    var f = store.rows('files').filter(function (r) { return r.id === S(id, 40); })[0];
    if (!f || f.status === 'محذوف') throw new Error('الملف غير موجود.');
    return f;
  }

  function addMsg(f, o) {
    store.insert('msgs', {
      id: util.id(), fileId: f.id, channel: o.channel || 'client', senderType: o.senderType,
      sender: o.sender || '', text: o.text || '', fileUrl: o.fileUrl || '', fileName: o.fileName || '', ts: util.now()
    });
    if (!o.silent) queueNote(f, o);
  }

  /* علامة «شوهدت»: تُحدَّث عند فتح الطرف الآخر للمحادثة */
  function markSeen(f, who) {
    var other = who === 'client' ? 'team' : 'client', col = who === 'client' ? 'seenClient' : 'seenTeam', last = 0;
    store.rows('msgs').forEach(function (m) { if (m.fileId === f.id && m.channel === 'client' && m.senderType === other) last = Math.max(last, N(m.ts)); });
    if (last > N(f[col])) { var p = {}; p[col] = util.now(); store.patch('files', f.id, p); touch(f.id); return true; }
    return false;
  }

  function bundle(f, team) {
    var steps = store.rows('steps').filter(function (s) { return s.fileId === f.id; }).sort(byOrder)
      .map(function (s) { return { id: s.id, stage: s.stage, title: s.title, status: s.status, doneBy: s.doneBy, doneAt: N(s.doneAt) }; });
    var reqs = store.rows('reqs').filter(function (r) { return r.fileId === f.id; })
      .map(function (r) { return { id: r.id, title: r.title, owner: r.owner, status: r.status, note: r.note, by: r.by, createdAt: N(r.createdAt), doneAt: N(r.doneAt) }; })
      .sort(function (a, b) { return a.createdAt - b.createdAt; });
    var msgs = store.rows('msgs').filter(function (m) { return m.fileId === f.id && (team || m.channel === 'client'); })
      .sort(byTs).map(function (m) {
        var doc = String(m.fileUrl || '').indexOf('doc:') === 0 ? String(m.fileUrl).slice(4) : '';
        return { id: m.id, channel: m.channel, senderType: m.senderType, sender: m.sender, text: m.text, docId: doc, fileName: m.fileName, ts: N(m.ts) };
      });
    var docs = store.rows('docs').filter(function (d) { return d.fileId === f.id; })
      .map(function (d) { return { id: d.id, name: d.name, size: N(d.size), ts: N(d.ts), by: d.by }; })
      .sort(function (a, b) { return b.ts - a.ts; });
    var file = {
      id: f.id, client: f.client, phone: f.phone, company: f.company, service: f.service,
      createdAt: N(f.createdAt), delivered: T(f.delivered), status: f.status || 'جارٍ', data: readData(f),
      seenClient: N(f.seenClient), seenTeam: N(f.seenTeam), linked: !!f.quoteId, post: readJson(f.post, {}),
      creds: readJson(f.creds, []).map(function (c) { return { id: c.id, label: c.label, user: c.user, note: c.note, hasPass: !!c.pass }; })
    };
    var qs = readJson(f.q, null);
    file.deliver = qs ? qs.deliver || [] : [];
    /* كشف الحساب يراه العميل والمدير فقط */
    var jj = readJson(f.j, null);
    if (((qs && qs.account) || (jj && jj.entries && jj.entries.length)) && (!team || curRole === 'مدير')) file.account = accountView(qs && qs.account, jj);
    if (team) { file.token = f.token; file.code = f.code; file.collected = T(f.collected); file.email = f.email || ''; }
    return { file: file, steps: steps, reqs: reqs, msgs: msgs, docs: docs, stages: STAGES, stamp: String(f.updated) };
  }

  function mergeData(old, inc, team, f, who) {
    var d = emptyData();
    ['form', 'activity', 'capital', 'address', 'nameEn'].forEach(function (k) { d[k] = S(inc[k] != null ? inc[k] : old[k], 600); });
    d.partners = (inc.partners || []).slice(0, 30).map(function (x) {
      return { name: S(x.name, 120), nationality: S(x.nationality, 60), share: S(x.share, 10), role: S(x.role, 30) || 'شريك' };
    }).filter(function (x) { return x.name; });
    var prev = {};
    (old.names || []).forEach(function (n) { prev[n.name] = n; });
    var changes = [];
    d.names = (inc.names || []).slice(0, 15).map(function (n) {
      var name = S(n.name, 120); if (!name) return null;
      var o = prev[name];
      if (team) {
        var st = NAME_ST.indexOf(n.status) > -1 ? n.status : 'قيد المراجعة';
        if (o && o.status !== st && st !== 'قيد المراجعة') changes.push('الاسم المقترح «' + name + '»: ' + st + (n.note ? ' (' + S(n.note, 200) + ')' : ''));
        return { name: name, status: st, note: S(n.note, 200) };
      }
      return o ? { name: name, status: o.status, note: o.note } : { name: name, status: 'قيد المراجعة', note: '' };
    }).filter(Boolean);
    /* العميل لا يستطيع حذف اسم تم البتّ فيه */
    if (!team) (old.names || []).forEach(function (o) {
      if (o.status !== 'قيد المراجعة' && !d.names.some(function (n) { return n.name === o.name; })) d.names.push(o);
    });
    changes.forEach(function (c) { addMsg(f, { senderType: 'system', sender: who, text: c }); });
    return d;
  }

  function nextFileId() {
    var y = new Date(util.now()).getFullYear(), mx = 0;
    store.rows('files').forEach(function (r) { var m = String(r.id).split('-'); if (m[0] === String(y)) mx = Math.max(mx, N(m[1])); });
    return y + '-' + ('00' + (mx + 1)).slice(-3);
  }
  function validCode(c) { return /^[A-Z0-9]{6,12}$/.test(c); }

  function saveUpload(f, p, who, senderType, channel) {
    var b64 = String(p.b64 || '');
    if (!b64) throw new Error('الملف فارغ.');
    if (b64.length > MAX_B64) throw new Error('الملف أكبر من ١٠ ميجابايت.');
    var folderId = f.folderId;
    if (!folderId) { folderId = drive.mkdir(f.id + ' - ' + (f.company || f.client)); store.patch('files', f.id, { folderId: folderId }); }
    var r = drive.save(folderId, S(p.name, 150) || 'مستند', S(p.mime, 100), b64);
    var docId = util.id();
    store.insert('docs', { id: docId, fileId: f.id, driveId: r.driveId, name: r.name, size: r.size, mime: S(p.mime, 100), ts: util.now(), by: who });
    addMsg(f, { channel: channel, senderType: senderType, sender: who, text: 'أرفق مستندًا', fileUrl: 'doc:' + docId, fileName: r.name });
  }
  /* تنزيل المستند يمر عبر البوابة فقط، وبعد التحقق من أنه يخص هذا الملف */
  function readDoc(f, docId) {
    var d = store.rows('docs').filter(function (x) { return x.id === S(docId, 40) && x.fileId === f.id; })[0];
    if (!d) throw new Error('المستند غير موجود.');
    var r = drive.read(d.driveId);
    return { name: d.name, mime: r.mime, b64: r.b64 };
  }

  /* ---------- مشروع التأسيس (عروض الأسعار): المصدر الوحيد لبيانات الملف المرتبط به ---------- */
  var EINV = 'التسجيل في منظومة الفاتورة الإلكترونية';
  var ADDON_STEPS = [
    ['einvoice', 'tax', EINV],
    ['stamp', 'tax', 'استخراج الختم الإلكتروني (التوقيع الإلكتروني)'],
    ['vat', 'tax', 'التسجيل في ضريبة القيمة المضافة'],
    ['social', 'tax', 'فتح ملف التأمينات الاجتماعية'],
    ['bankAccount', 'post', 'فتح الحساب البنكي للشركة'],
    ['exportCard', 'post', 'استخراج البطاقة التصديرية'],
    ['importCard', 'post', 'استخراج البطاقة الاستيرادية'],
    ['construction', 'post', 'التسجيل في اتحاد مقاولي التشييد والبناء'],
    ['trademark', 'post', 'تسجيل العلامة التجارية']
  ];
  var VOFFICE = { fifth: 'مقر إداري: التجمع الخامس', heliopolis: 'مقر إداري: مصر الجديدة', nasrcity: 'مقر إداري: مدينة نصر' };
  var PAY_METHOD = { cash: 'نقدًا', instapay: 'إنستاباي', vodafone: 'فودافون كاش', bank: 'تحويل بنكي' };
  var POST_KEYS = ['crNo', 'crDate', 'crOffice', 'crRenew', 'taxNo', 'taxFile', 'taxOffice', 'taxExpiry', 'vatNo', 'insNo', 'expNo', 'unifiedNo'];

  function readJson(v, def) { try { return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function money(n) { return String(Math.round(N(n))).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  function quoteInfo(q) {
    var r = q.rec || {}, st = r.state || {}, ap = r.approved || null;
    var partners = (st.partners || []).filter(function (x) { return x && S(x.name, 120); }).map(function (x) {
      return { name: S(x.name, 120), nationality: '', share: x.isExternal ? '' : String(N(x.share) || ''), role: x.isExternal ? 'مدير' : (x.isDirector ? 'شريك ومدير' : 'شريك') };
    });
    var info = {
      qid: String(q.id), approved: !!ap, deleted: !!r.deleted,
      company: S(st.nameAr, 160), client: S(st.clientName, 120), phone: digits(st.clientPhone), email: S(st.clientEmail, 120),
      data: {
        form: st.soloMode ? 'شركة شخص واحد' : 'ذات مسؤولية محدودة', activity: S(st.actDetail, 600),
        capital: st.capitalValue ? String(N(st.capitalValue)) : '',
        address: S(st.address, 300) || (st.hasLoc === 'no' ? (VOFFICE[st.virtualOffice] || '') : ''),
        nameEn: S(st.nameEn, 160), partners: partners
      },
      steps: ADDON_STEPS.filter(function (a) { return !!st[a[0]]; }).map(function (a) { return [a[1], a[2]]; }),
      deliver: [], account: null
    };
    if (ap) {
      var done = ap.docsDone || {};
      info.deliver = (ap.docs || []).map(function (d) { return { name: S(d, 200), done: !!done[d] }; });
      info.account = {
        total: N(ap.amount), at: S(ap.at, 20),
        entries: (ap.entries || []).map(function (e) {
          return { id: S(e.id, 40), date: S(e.date, 20), amount: N(e.amount), kind: S(e.kind, 20) || 'pay', method: PAY_METHOD[e.method] || S(e.method, 30), note: S(e.note, 200) };
        }),
        installments: (st.installments || []).filter(function (i) { return i && (S(i.label) || N(i.amount)); })
          .map(function (i) { return { label: S(i.label, 120), amount: N(i.amount) }; })
      };
    }
    return info;
  }

  /* ---------- يومية المكتب: مدفوعات العميل ومصروفاته بالربط على رقم الهاتف ---------- */
  var J_KIND = { IN_CLIENT: 'pay', OPENING: 'open', GOV_FEE: 'fee', OP_EXP: 'exp', CLIENT_REFUND: 'refund' };
  function normPhone(p) {

/* ---- in-app alerts ---- */
var audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1175, t + 0.12);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.34);
  } catch (e) {}
}
function askNotify() { try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} }
function lastOther(b) {
  var t = 0, txt = '';
  (b ? b.msgs : []).forEach(function (m) {
    var mine = S.mode === 'team' ? (m.senderType === 'team' && m.sender === S.tname) : m.senderType === 'client';
    if (!mine && !m.pending && m.ts > t) { t = m.ts; txt = m.fileName ? 'مستند: ' + m.fileName : m.text; }
  });
  return { t: t, txt: txt };
}
function ping(text) {
  beep();
  try { if (APP && document.hidden) AndroidBridge.notify('بوابة العملاء', text); } catch (e) {}
  try { if (document.hidden && window.Notification && Notification.permission === 'granted') new Notification('بوابة العملاء — مكتب محمود سالم', { body: text, icon: 'icon-192.png' }); } catch (e) {}
}

function upload(file, channel) {
  if (!file) return Promise.resolve();
  if (file.size > 10 * 1024 * 1024) { toast('الملف أكبر من ١٠ ميجابايت.'); return Promise.resolve(); }
  toast('جارٍ رفع «' + file.name + '»…');
  return new Promise(function (res) {
    var r = new FileReader();
    r.onload = function () {
      rpc(act('upload'), auth({ fileId: S.fileId, name: file.name, mime: file.type, b64: String(r.result).split(',')[1] || '', channel: channel || 'client' }))
        .then(function (b) { setBundle(b); S.lastMsgId = ''; renderConv(); toast('رُفع «' + file.name + '»'); }).catch(function (e) { toast(e.message); }).then(res);
    };
    r.onerror = function () { toast('تعذّرت قراءة الملف.'); res(); };
    r.readAsDataURL(file);
  });
}
function openDoc(docId) {
  if (!docId) return;
  if (!LIVE) { toast('التنزيل يعمل في النسخة الفعلية بعد التحقق من صاحب الملف.'); return; }
  toast('جارٍ تجهيز المستند…');
  rpc(act('file'), auth({ fileId: S.fileId, docId: docId })).then(function (r) {
    var bin = atob(r.b64), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    if (APP) { try { AndroidBridge.saveFile(r.name, r.mime || 'application/octet-stream', r.b64); return; } catch (e) {} }
    var blob = new Blob([u8], { type: r.mime || 'application/octet-stream' });
    try {
      var file = new File([blob], r.name, { type: blob.type });
      if (IOS && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: r.name }).catch(function () {}); return; }
    } catch (e) {}
    var url = URL.createObjectURL(blob);
    if (IOS && standalone()) { location.href = url; return; }
    var a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }).catch(function (e) { toast(e.message); });
}

/* ---------- polling ---------- */
var pollT = null;
function stopPoll() { if (pollT) clearInterval(pollT); pollT = null; }
function startPoll() {
  stopPoll();
  pollT = setInterval(function () {
    S.tick = (S.tick || 0) + 1;
    if (document.hidden && S.tick % 4) return;
    if (S.mode === 'team') rpc('team.listPoll', auth()).then(function (r) { if (r.stamp !== S.listStamp) loadList(); }).catch(function () {});
    if (!S.b || S.sending) return;
    var fid = S.fileId;
    rpc(act('poll'), auth({ fileId: fid })).then(function (r) {
      if (r.stamp === S.stamp || S.sending || S.fileId !== fid) return;
      return rpc(act('get'), auth({ fileId: fid })).then(function (b) {
        if (S.fileId !== fid || S.sending) return;
        var was = lastOther(S.b).t, now = lastOther(b);
        setBundle(b);
        if (now.t > was) ping(now.txt);
        var ae = document.activeElement, busy = ae && $('#panel').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
        if (S.tab === 'chat') { renderHead(); renderMsgs(false); }
        else if (S.tab === 'data') { if (!S.dirty && !busy) renderConv(); }
        else if (!busy && !document.querySelector('dialog[open]')) renderConv();
      });
    }).catch(function () {});
  }, LIVE ? 4000 : 3000);
}

    if (!S.code) return showClientLogin();
    return rpc('client.get', auth()).then(function (b) { clientShell(b); }).catch(function () { showClientLogin(); });
  }
  S.mode = 'team';
  var saved = null; try { saved = JSON.parse(load('pt') || 'null'); } catch (e) {}
  if (!saved) return showTeamLogin();

  rpc('team.login', auth()).then(function (m) { S.baseUrl = API ? portalUrl() : m.baseUrl; teamShell(); }).catch(function () { showTeamLogin(); });
}
