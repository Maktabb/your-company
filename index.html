<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14264b">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مكتب محمود سالم">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>html{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<script src="config.js"></script>
<title>بوابة العملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: messenger. Conversation list (team) beside one conversation; frosted-glass bars float over the scrolling thread */
:root{
  --bg:#e6eaf2; --bg-a:#c9d6f2; --bg-b:#f3e3bd; --wall:#edf0f6; --wall-dot:rgba(20,38,75,.055);
  --surface:#ffffff; --surface-2:#f3f5fa; --ink:#111a2e; --muted:#5b667d; --line:rgba(20,38,75,.12);
  --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.82); --glass-line:rgba(255,255,255,.8); --glass-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 10px 30px rgba(20,38,75,.10);
  --navy:#14264b; --navy-2:#24407c; --on-navy:#f6f2e6;
  --gold:#b98a2c; --gold-2:#d9b25c; --gold-ink:#875f12; --gold-soft:#f6ecd4; --on-gold:#1c1504;
  --out:#dbe6fd; --out-ink:#0f1c3a; --in:#ffffff; --internal:#fbf0d3; --sys:rgba(255,255,255,.72);
  --ok:#1a7a4a; --ok-bg:#dff3e7; --warn:#96590a; --warn-bg:#fbedd2; --bad:#b22f29; --bad-bg:#fbe3e1; --info:#2a59b3; --info-bg:#e2ebfc;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --f-head:'Noto Kufi Arabic','IBM Plex Sans Arabic',Tahoma,Arial,sans-serif;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#070c17; --bg-a:#14244d; --bg-b:#3a2c10; --wall:#0a111f; --wall-dot:rgba(255,255,255,.035);
  --surface:#131b2d; --surface-2:#18223a; --ink:#e9edf6; --muted:#98a3ba; --line:rgba(255,255,255,.10);
  --glass:rgba(22,31,52,.62); --glass-2:rgba(26,36,60,.84); --glass-line:rgba(255,255,255,.10); --glass-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 12px 34px rgba(0,0,0,.45);
  --navy:#1b3266; --navy-2:#2b4a94; --on-navy:#f3ecd9;
  --gold:#d8ac52; --gold-2:#ecc877; --gold-ink:#e9c373; --gold-soft:#332915; --on-gold:#1c1504;
  --out:#22407f; --out-ink:#eef3ff; --in:#18223a; --internal:#2f2713; --sys:rgba(30,40,66,.78);
  --ok:#5fcb93; --ok-bg:#122b1d; --warn:#eaae4f; --warn-bg:#33260e; --bad:#f08379; --bad-bg:#381816; --info:#8fb0f2; --info-bg:#172648; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#070c17; --bg-a:#14244d; --bg-b:#3a2c10; --wall:#0a111f; --wall-dot:rgba(255,255,255,.035);
  --surface:#131b2d; --surface-2:#18223a; --ink:#e9edf6; --muted:#98a3ba; --line:rgba(255,255,255,.10);
  --glass:rgba(22,31,52,.62); --glass-2:rgba(26,36,60,.84); --glass-line:rgba(255,255,255,.10); --glass-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 12px 34px rgba(0,0,0,.45);
  --navy:#1b3266; --navy-2:#2b4a94; --on-navy:#f3ecd9;
  --gold:#d8ac52; --gold-2:#ecc877; --gold-ink:#e9c373; --gold-soft:#332915; --on-gold:#1c1504;
  --out:#22407f; --out-ink:#eef3ff; --in:#18223a; --internal:#2f2713; --sys:rgba(30,40,66,.78);
  --ok:#5fcb93; --ok-bg:#122b1d; --warn:#eaae4f; --warn-bg:#33260e; --bad:#f08379; --bad-bg:#381816; --info:#8fb0f2; --info-bg:#172648; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;overflow:hidden;
  background-image:radial-gradient(60vw 50vh at 100% 0%,var(--bg-a),transparent 70%),radial-gradient(50vw 45vh at 0% 100%,var(--bg-b),transparent 70%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow)}

#root{height:100%;display:flex;flex-direction:column}
.demo{flex:none;background:var(--gold-soft);color:var(--gold-ink);font-size:12.5px;border-bottom:1px solid var(--line)}
.demo>div{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:6px}
#app{flex:1;min-height:0;display:flex}

/* controls */
.seg{display:inline-flex;background:var(--glass-2);border:1px solid var(--glass-line);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--navy);color:var(--on-navy);box-shadow:0 2px 8px rgba(20,38,75,.25)}
.ib{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--glass-line);background:var(--glass-2);color:var(--ink);box-shadow:var(--glass-shadow);transition:transform .15s}
.ib:active{transform:scale(.92)}
.ib svg{width:20px;height:20px}
.ib.gold{background:linear-gradient(160deg,var(--gold-2),var(--gold));color:var(--on-gold);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--glass-line);background:var(--glass-2);box-shadow:var(--glass-shadow);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(160deg,var(--navy-2),var(--navy));color:var(--on-navy);border-color:transparent}
.btn.gold{background:linear-gradient(160deg,var(--gold-2),var(--gold));color:var(--on-gold);border-color:transparent}
.btn.sm{padding:6px 13px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:wait}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.inp{resize:none;min-height:44px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)}
.c-info{background:var(--info-bg);color:var(--info)} .c-mute{background:var(--surface-2);color:var(--muted)} .c-gold{background:var(--gold-soft);color:var(--gold-ink)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-size:17px;color:var(--gold-2);background:linear-gradient(150deg,var(--navy-2),var(--navy));box-shadow:0 0 0 1.5px var(--gold) inset}
.av.s{width:40px;height:40px;font-size:15px}

/* gate (login) */
.gate{margin:auto;width:min(420px,100%);padding-block:20px}
.gate .card{border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.gate .av{width:64px;height:64px;font-size:20px;margin:0 auto}
.codein{letter-spacing:8px;text-align:center;font-size:26px;font-weight:700;direction:ltr;text-transform:uppercase}
.err{color:var(--bad);font-size:14px;min-height:1.2em}

/* side list */
.side{width:380px;flex:none;display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line)}
.side-h{padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-radius:0;border-width:0 0 1px}
.side-h .top{display:flex;align-items:center;gap:8px}
.side-h h1{font-size:19px;flex:1;min-width:0}
.search{border-radius:999px;background:var(--surface);padding:9px 16px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--glass-2);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold)}
.list{flex:1;overflow-y:auto;min-height:0;padding-block:6px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:start;border:0;background:transparent;padding-block:10px;cursor:pointer;position:relative}
.item:hover,.item.on{background:var(--glass)}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pv{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .pg{font-size:12px;color:var(--gold-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--muted);flex:none}
.badge{min-width:21px;height:21px;padding:0 6px;border-radius:99px;background:linear-gradient(160deg,var(--gold-2),var(--gold));color:var(--on-gold);font-size:12px;font-weight:700;display:inline-grid;place-items:center}
.empty{padding:22px 16px;color:var(--muted);font-size:14px;text-align:center}

/* conversation */
.conv{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;--top:120px;--bot:0px}
.scroll{position:absolute;inset:0;overflow-y:auto;background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 1.5px,transparent 1.6px),radial-gradient(var(--wall-dot) 1.5px,transparent 1.6px);background-size:26px 26px;background-position:0 0,13px 13px;overscroll-behavior:contain}
.inner{max-width:880px;margin:0 auto;padding-top:calc(var(--top) + 12px);padding-bottom:calc(var(--bot) + 18px);min-height:100%;display:flex;flex-direction:column;gap:12px}
.chead{position:absolute;inset:0 0 auto;z-index:5;border-width:0 0 1px;border-radius:0;padding-block:10px 9px;display:flex;flex-direction:column;gap:9px}
.chead .r1{display:flex;align-items:center;gap:10px}
.chead .ttl{flex:1;min-width:0}
.chead .ttl b{display:block;font-family:var(--f-head);font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .ttl span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{align-self:center;overflow-x:auto;scrollbar-width:none}
.dot{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--gold);color:var(--on-gold);font-size:11px;display:inline-grid;place-items:center}
.placeholder{margin:auto;text-align:center;color:var(--muted);padding:30px}
.back{display:none}

/* chat */
.chan{position:sticky;top:calc(var(--top) + 8px);z-index:3;align-self:center}
.day,.sys{align-self:center;background:var(--sys);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--muted);font-size:12.5px;border-radius:99px;padding:3px 13px;max-width:92%;text-align:center;border:1px solid var(--glass-line)}
.msgs{display:flex;flex-direction:column;gap:5px;flex:1;justify-content:flex-end}
.msg{max-width:min(80%,520px);padding:7px 12px 5px;border-radius:19px 19px 19px 6px;background:var(--in);align-self:flex-start;min-width:0;box-shadow:0 1px 1.5px rgba(10,20,45,.13)}
.msg.me{background:var(--out);color:var(--out-ink);align-self:flex-end;border-radius:19px 19px 6px 19px}
.internal .msg{background:var(--internal)} .internal .msg.me{background:var(--gold-soft);color:var(--ink)}
.msg .who{font-size:12.5px;font-weight:700;color:var(--gold-ink)}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tm{font-size:11px;opacity:.7;display:flex;gap:4px;align-items:center;justify-content:flex-end;direction:ltr;margin-top:1px}
.tm svg{width:16px;height:12px}
.tm .seen{color:var(--gold-ink);display:inline-flex}
.msg.gap{margin-top:8px}
.msg.pending{opacity:.7}
.att{display:flex;align-items:center;gap:10px;background:rgba(127,140,170,.14);border:0;border-radius:13px;padding:8px 10px;margin:2px 0 3px;font-size:13.5px;cursor:pointer;width:100%;text-align:start;color:inherit;min-width:0}
.att .ext{flex:none}
.att span{overflow-wrap:anywhere;min-width:0}
.ext{width:36px;height:42px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-head);font-size:9.5px;color:var(--on-gold);background:linear-gradient(160deg,var(--gold-2),var(--gold))}
.composer{position:absolute;inset:auto 0 0;z-index:5;padding-block:9px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));border-width:1px 0 0;border-radius:0}
.composer>div{max-width:880px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;border-radius:22px;max-height:130px;padding:9px 16px}
.note-int{align-self:center;font-size:12.5px;font-weight:600;color:var(--gold-ink);background:var(--gold-soft);border-radius:99px;padding:3px 13px}

/* cards (other tabs) */
.card{border-radius:var(--r-lg);overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px 8px}
.card-h h2{font-size:15.5px}
.pad{padding:14px 16px}
.rowi{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.rowi .t{flex:1;min-width:170px}
.rowi.need{background:var(--warn-bg)}
.addform{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px dashed var(--line)}
.addform .inp{flex:1;min-width:150px;border-radius:999px}
.track{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line)}
.stage{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px;background:var(--glass-2)}
.stage .sn{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.bar{height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:99px;transition:width .5s}
.stage.done .bar i{background:var(--ok)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--gold);width:17px;height:17px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line)}
.steps .sl{font-size:12px;font-weight:700;color:var(--gold-ink);background:var(--gold-soft);padding:6px 16px}
.mark{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;background:var(--surface);color:transparent;padding:0}
.mark.done{background:var(--ok);border-color:var(--ok);color:#fff}
.mark.doing{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 4px var(--surface)}
button.mark{cursor:pointer}
.st-t.doing{font-weight:700}
.st-m{font-size:12px;color:var(--muted)}
.partner{display:grid;grid-template-columns:2fr 1fr .8fr 1.2fr auto;gap:8px;align-items:end;padding:10px 16px;border-top:1px solid var(--line)}
@media (max-width:640px){.partner{grid-template-columns:1fr 1fr}.partner .f-name{grid-column:1/-1}}
.namerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line)}
.namerow .inp{flex:1;min-width:140px}
.savebar{position:sticky;bottom:calc(var(--bot) + 12px);display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:999px;padding:8px 8px 8px 18px;z-index:2}
.doc{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line)}
.doc .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}

/* sheets (dialogs) */
dialog{border:1px solid var(--glass-line);border-radius:26px;padding:0;background:var(--glass-2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100% - 24px);box-shadow:0 24px 70px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(8,14,30,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dlg-h{padding:16px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-h h2{font-size:17px}
.dlg-b{padding:6px 18px 16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:62vh}
.dlg-f{padding:12px 18px 16px;display:flex;gap:8px;flex-wrap:wrap}
.invite{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;user-select:all}
.bigcode{font-size:26px;font-weight:700;letter-spacing:5px;direction:ltr;font-variant-numeric:tabular-nums;color:var(--gold-ink)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.coderow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.coderow:first-child{border-top:0}
.coderow .t{flex:1;min-width:0}

.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:999px;font-size:14px;z-index:80;max-width:calc(100vw - 32px);text-align:center}
.sk{border-radius:16px;height:54px;background:linear-gradient(90deg,var(--glass) 25%,var(--glass-2) 50%,var(--glass) 75%);background-size:200% 100%}

@media (max-width:860px){
  .side{width:100%;border:0}
  .app-team .conv{display:none}
  .app-team.in-conv .side{display:none}
  .app-team.in-conv .conv{display:flex}
  .back{display:grid}
  .seg button{padding:6px 11px}
}
@media (prefers-reduced-motion:no-preference){
  .msg.new,.sys.new{animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{transform:translateY(8px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .sk{animation:sh 1.2s linear infinite}@keyframes sh{to{background-position:-200% 0}}
  dialog[open]{animation:up .22s ease-out}@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
}
</style>

</head>
<body>
<div id="root"><div id="demo"></div><div id="app"></div></div>
<div id="toast" class="toast glass" hidden></div>

<script>
/* ===== منطق البوابة المشترك (يعمل على الخادم وفي المعاينة) ===== */

/* رمز دخول العميل: أول حرف من الاسم بالإنجليزية (كبير) + آخر ٦ أرقام من الهاتف */
function portalCode(name, phone, letter) {
  var MAP = { 'ا': 'A', 'أ': 'A', 'إ': 'E', 'آ': 'A', 'ع': 'A', 'ب': 'B', 'ت': 'T', 'ط': 'T', 'ث': 'T', 'ج': 'G', 'غ': 'G', 'ح': 'H', 'ه': 'H', 'ة': 'H', 'خ': 'K', 'ك': 'K', 'ق': 'K',
    'د': 'D', 'ض': 'D', 'ذ': 'Z', 'ز': 'Z', 'ظ': 'Z', 'ر': 'R', 'س': 'S', 'ص': 'S', 'ش': 'S', 'ف': 'F', 'ل': 'L', 'م': 'M', 'ن': 'N', 'و': 'W', 'ي': 'Y', 'ى': 'Y' };
  var d = String(phone || '').replace(/[٠-٩]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(c); }).replace(/\D/g, '');
  var L = String(letter || '').toUpperCase().replace(/[^A-Z]/g, '').charAt(0);
  if (!L) {
    var n = String(name || '').trim().replace(/^(أ\/|ا\/|م\/|د\/|السيد|الأستاذ|الاستاذ|استاذ|أستاذ)\s*/, '');
    var c = n.charAt(0);
    L = /[a-z]/i.test(c) ? c.toUpperCase() : (MAP[c] || '');
  }
  if (!L || d.length < 6) return '';
  return L + d.slice(-6);
}

function makeCore(store, drive, util, quotes) {
  var STAGES = [
    { key: 'gafi', label: 'الهيئة العامة للاستثمار', hint: 'حتى صدور السجل التجاري' },
    { key: 'tax', label: 'الضرائب', hint: 'البطاقة الضريبية وما يليها' }
  ];
  var TEMPLATES = {
    formation: {
      steps: [
        ['gafi', 'استلام بيانات الشركاء والمستندات'],
        ['gafi', 'اعتماد الاسم التجاري'],
        ['gafi', 'شهادة إيداع رأس المال من البنك'],
        ['gafi', 'مراجعة العقد وتوقيعه'],
        ['gafi', 'صدور السجل التجاري'],
        ['tax', 'استخراج البطاقة الضريبية'],
        ['tax', 'التسجيل في منظومة الفاتورة الإلكترونية']
      ],
      reqs: [
        ['صور بطاقات الرقم القومي أو جوازات السفر لجميع الشركاء', 'client'],
        ['تحديد النشاط واقتراح ثلاثة أسماء تجارية على الأقل', 'client'],
        ['عقد إيجار المقر أو سند الحيازة', 'client']
      ]
    },
    other: {
      steps: [
        ['gafi', 'استلام الطلب والمستندات'],
        ['gafi', 'تقديم الطلب للجهة المختصة'],
        ['gafi', 'صدور المستخرج أو القرار']
      ],
      reqs: [['المستندات المطلوبة للخدمة', 'client']]
    }
  };
  var STEP_ST = ['لم تبدأ', 'جارية', 'تمت'];
  var REQ_ST = ['مفتوح', 'جارٍ التنفيذ', 'تم'];
  var NAME_ST = ['قيد المراجعة', 'مقبول', 'مرفوض'];
  var MAX_FAILS = 5, LOCK_SEC = 900, MAX_B64 = 14200000;
  var cache = util.cache;

  function T(v) { return v === true || v === 'true' || v === 'TRUE'; }
  function N(v) { return Number(v) || 0; }
  function S(v, max) { return String(v == null ? '' : v).trim().slice(0, max || 500); }
  function digits(v) {
    return String(v || '').replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); })
      .replace(/[۰-۹]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); }).replace(/\D/g, '');
  }
  function normCode(v) {
    return String(v || '').replace(/[٠-٩]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 20);
  }
  function byOrder(a, b) { return N(a.order) - N(b.order); }
  function byTs(a, b) { return N(a.ts) - N(b.ts); }
  function stageLabel(k) { for (var i = 0; i < STAGES.length; i++) if (STAGES[i].key === k) return STAGES[i].label; return k; }

  /* ---------- الحماية: إيقاف المحاولات المتكررة ---------- */
  function fails(k) { return N(cache.get('f_' + k)); }
  function guard(k) { if (fails(k) >= MAX_FAILS) throw new Error('تم إيقاف المحاولات مؤقتًا لحماية الملف. يُرجى المحاولة بعد ١٥ دقيقة أو التواصل مع المكتب.'); }
  function fail(k) { cache.put('f_' + k, String(fails(k) + 1), LOCK_SEC); }

  function emptyData() { return { form: '', activity: '', capital: '', address: '', partners: [], names: [] }; }
  function readData(f) {
    try { var d = f.data ? JSON.parse(f.data) : null; return d ? Object.assign(emptyData(), d) : emptyData(); }
    catch (e) { return emptyData(); }
  }
  function touch(id) {
    var now = util.now();
    store.patch('files', id, { updated: now });
    cache.put('s_' + id, String(now), 21600);
    cache.put('ls', String(now), 21600);
  }

  function fileForClient(p) {
    var t = S(p.token, 80), code = normCode(p.code);
    if (!t) throw new Error('الرابط غير صالح.');
    guard('c' + t);
    var f = store.rows('files').filter(function (r) { return r.token === t; })[0];
    if (!f || !code || normCode(f.code) !== code) { fail('c' + t); throw new Error('رمز الدخول غير صحيح. يُرجى التأكد من الرمز المرسل من المكتب.'); }
    cache.put('a_' + t + '_' + code, f.id, 600);
    return f;
  }
  function member(p) {
    var name = S(p.tname, 80), code = normCode(p.tcode);
    if (!name) throw new Error('الاسم أو الرمز غير صحيح.');
    guard('t' + name);
    var m = store.rows('team').filter(function (r) { return r.name === name && normCode(r.code) === code; })[0];
    if (!m || !code) { fail('t' + name); throw new Error('الاسم أو الرمز غير صحيح.'); }
    cache.put('m_' + name + '_' + code, '1', 600);
    return m;
  }
  function memberFast(p) {
    if (cache.get('m_' + S(p.tname, 80) + '_' + normCode(p.tcode))) return true;
    member(p); return true;
  }
  function fileById(id) {
    var f = store.rows('files').filter(function (r) { return r.id === S(id, 40); })[0];
    if (!f) throw new Error('الملف غير موجود.');
    return f;
  }

  function addMsg(f, o) {
    store.insert('msgs', {
      id: util.id(), fileId: f.id, channel: o.channel || 'client', senderType: o.senderType,
      sender: o.sender || '', text: o.text || '', fileUrl: o.fileUrl || '', fileName: o.fileName || '', ts: util.now()
    });
  }

  /* علامة «شوهدت»: تُحدَّث عند فتح الطرف الآخر للمحادثة */
  function markSeen(f, who) {
    var other = who === 'client' ? 'team' : 'client', col = who === 'client' ? 'seenClient' : 'seenTeam', last = 0;
    store.rows('msgs').forEach(function (m) { if (m.fileId === f.id && m.channel === 'client' && m.senderType === other) last = Math.max(last, N(m.ts)); });
    if (last > N(f[col])) { var p = {}; p[col] = util.now(); store.patch('files', f.id, p); touch(f.id); return true; }
    return false;
  }

  function bundle(f, team) {
    var steps = store.rows('steps').filter(function (s) { return s.fileId === f.id; }).sort(byOrder)
      .map(function (s) { return { id: s.id, stage: s.stage, title: s.title, status: s.status, doneBy: s.doneBy, doneAt: N(s.doneAt) }; });
    var reqs = store.rows('reqs').filter(function (r) { return r.fileId === f.id; })
      .map(function (r) { return { id: r.id, title: r.title, owner: r.owner, status: r.status, note: r.note, by: r.by, createdAt: N(r.createdAt), doneAt: N(r.doneAt) }; })
      .sort(function (a, b) { return a.createdAt - b.createdAt; });
    var msgs = store.rows('msgs').filter(function (m) { return m.fileId === f.id && (team || m.channel === 'client'); })
      .sort(byTs).map(function (m) {
        var doc = String(m.fileUrl || '').indexOf('doc:') === 0 ? String(m.fileUrl).slice(4) : '';
        return { id: m.id, channel: m.channel, senderType: m.senderType, sender: m.sender, text: m.text, docId: doc, fileName: m.fileName, ts: N(m.ts) };
      });
    var docs = store.rows('docs').filter(function (d) { return d.fileId === f.id; })
      .map(function (d) { return { id: d.id, name: d.name, size: N(d.size), ts: N(d.ts), by: d.by }; })
      .sort(function (a, b) { return b.ts - a.ts; });
    var file = {
      id: f.id, client: f.client, phone: f.phone, company: f.company, service: f.service,
      createdAt: N(f.createdAt), delivered: T(f.delivered), status: f.status || 'جارٍ', data: readData(f),
      seenClient: N(f.seenClient), seenTeam: N(f.seenTeam)
    };
    if (team) { file.token = f.token; file.code = f.code; file.collected = T(f.collected); }
    return { file: file, steps: steps, reqs: reqs, msgs: msgs, docs: docs, stages: STAGES, stamp: String(f.updated) };
  }

  function mergeData(old, inc, team, f, who) {
    var d = emptyData();
    ['form', 'activity', 'capital', 'address'].forEach(function (k) { d[k] = S(inc[k] != null ? inc[k] : old[k], 600); });
    d.partners = (inc.partners || []).slice(0, 30).map(function (x) {
      return { name: S(x.name, 120), nationality: S(x.nationality, 60), share: S(x.share, 10), role: S(x.role, 30) || 'شريك' };
    }).filter(function (x) { return x.name; });
    var prev = {};
    (old.names || []).forEach(function (n) { prev[n.name] = n; });
    var changes = [];
    d.names = (inc.names || []).slice(0, 15).map(function (n) {
      var name = S(n.name, 120); if (!name) return null;
      var o = prev[name];
      if (team) {
        var st = NAME_ST.indexOf(n.status) > -1 ? n.status : 'قيد المراجعة';
        if (o && o.status !== st && st !== 'قيد المراجعة') changes.push('الاسم المقترح «' + name + '»: ' + st + (n.note ? ' (' + S(n.note, 200) + ')' : ''));
        return { name: name, status: st, note: S(n.note, 200) };
      }
      return o ? { name: name, status: o.status, note: o.note } : { name: name, status: 'قيد المراجعة', note: '' };
    }).filter(Boolean);
    /* العميل لا يستطيع حذف اسم تم البتّ فيه */
    if (!team) (old.names || []).forEach(function (o) {
      if (o.status !== 'قيد المراجعة' && !d.names.some(function (n) { return n.name === o.name; })) d.names.push(o);
    });
    changes.forEach(function (c) { addMsg(f, { senderType: 'system', sender: who, text: c }); });
    return d;
  }

  function nextFileId() {
    var y = new Date(util.now()).getFullYear(), mx = 0;
    store.rows('files').forEach(function (r) { var m = String(r.id).split('-'); if (m[0] === String(y)) mx = Math.max(mx, N(m[1])); });
    return y + '-' + ('00' + (mx + 1)).slice(-3);
  }
  function validCode(c) { return /^[A-Z][0-9]{6}$/.test(c); }

  function saveUpload(f, p, who, senderType, channel) {
    var b64 = String(p.b64 || '');
    if (!b64) throw new Error('الملف فارغ.');
    if (b64.length > MAX_B64) throw new Error('الملف أكبر من ١٠ ميجابايت.');
    var folderId = f.folderId;
    if (!folderId) { folderId = drive.mkdir(f.id + ' - ' + (f.company || f.client)); store.patch('files', f.id, { folderId: folderId }); }
    var r = drive.save(folderId, S(p.name, 150) || 'مستند', S(p.mime, 100), b64);
    var docId = util.id();
    store.insert('docs', { id: docId, fileId: f.id, driveId: r.driveId, name: r.name, size: r.size, mime: S(p.mime, 100), ts: util.now(), by: who });
    addMsg(f, { channel: channel, senderType: senderType, sender: who, text: 'أرفق مستندًا', fileUrl: 'doc:' + docId, fileName: r.name });
  }
  /* تنزيل المستند يمر عبر البوابة فقط، وبعد التحقق من أنه يخص هذا الملف */
  function readDoc(f, docId) {
    var d = store.rows('docs').filter(function (x) { return x.id === S(docId, 40) && x.fileId === f.id; })[0];
    if (!d) throw new Error('المستند غير موجود.');
    var r = drive.read(d.driveId);
    return { name: d.name, mime: r.mime, b64: r.b64 };
  }

  /* ---------- قراءة عروض الأسعار (أرشيف الشركات) ---------- */
  var FORM_MAP = { llc: 'ذات مسؤولية محدودة', opc: 'شركة شخص واحد', smc: 'شركة شخص واحد', single: 'شركة شخص واحد', jsc: 'مساهمة', sae: 'مساهمة', partnership: 'تضامن' };
  var ADDONS = [
    { re: /invoice|einv|فاتور/i, title: 'التسجيل في منظومة الفاتورة الإلكترونية' },
    { re: /stamp|token|seal|signature|ختم|توقيع/i, title: 'استخراج الختم الإلكتروني (التوقيع الإلكتروني)' },
    { re: /vat|added|قيمة|مضاف/i, title: 'التسجيل في ضريبة القيمة المضافة' },
    { re: /insur|social|تأمين/i, title: 'فتح ملف التأمينات الاجتماعية' }
  ];
  function nk(k) { return String(k).toLowerCase().replace(/[\s_\-]/g, ''); }
  function walk(o, fn, path, depth) {
    if (!o || typeof o !== 'object' || (depth || 0) > 5) return;
    Object.keys(o).forEach(function (k) { fn(k, o[k], (path || '') + '/' + k); walk(o[k], fn, (path || '') + '/' + k, (depth || 0) + 1); });
  }
  function txt(v) {
    if (v == null) return '';
    if (Array.isArray(v)) return v.map(txt).filter(Boolean).join('، ');
    if (typeof v === 'object') return txt(v.nameAr || v.label || v.name || v.title || v.text || '');
    return String(v).trim();
  }
  function pick(o, cands) {
    var exact = null, part = null, cn = cands.map(nk);
    walk(o, function (k, v) {
      if (v == null || v === '' || (typeof v === 'object' && !Array.isArray(v) && !(v.nameAr || v.label || v.name))) return;
      var key = nk(k);
      if (exact == null && cn.indexOf(key) > -1) exact = v;
      else if (part == null && cn.some(function (c) { return key.indexOf(c) > -1; })) part = v;
    });
    return txt(exact != null ? exact : part);
  }
  function quoteInfo(q) {
    var r = q.rec || {}, st = r.state || r;
    var addons = [], approved = false;
    walk(r, function (k, v, path) {
      var key = nk(k);
      if (/approv|accepted|اعتماد|معتمد/.test(key) && (v === true || v === 'true' || /معتمد|approved|accepted/i.test(String(v)))) approved = true;
      if (/^status$|حالة/.test(key) && /معتمد|approved|accepted|won/i.test(String(v))) approved = true;
      if (v === true || (typeof v === 'number' && v > 0 && /addon|extra|option|service/i.test(path))) {
        ADDONS.forEach(function (a) { if (a.re.test(k) && addons.indexOf(a.title) < 0) addons.push(a.title); });
      }
    });
    walk(r, function (k, v) {
      if (!Array.isArray(v) || !/addon|extra|option|service|إضاف/i.test(k)) return;
      v.forEach(function (it) {
        var label = txt(it) + ' ' + (it && typeof it === 'object' ? (it.id || it.key || '') : '');
        if (it && typeof it === 'object' && (it.selected === false || it.checked === false || it.on === false)) return;
        ADDONS.forEach(function (a) { if (a.re.test(label) && addons.indexOf(a.title) < 0) addons.push(a.title); });
      });
    });
    var formRaw = pick(st, ['companyType', 'legalForm', 'entityType', 'formType', 'type', 'form', 'شكل']);
    return {
      qid: String(q.id), updatedAt: q.updatedAt || 0, approved: approved,
      company: S(st.nameAr || pick(st, ['companyName', 'nameAr', 'company']), 160),
      client: S(st.clientName || pick(st, ['clientName', 'customerName', 'client', 'customer']), 120),
      phone: digits(pick(st, ['clientPhone', 'phone', 'mobile', 'whatsapp', 'tel', 'هاتف', 'موبايل', 'تليفون'])),
      form: S(FORM_MAP[nk(formRaw)] || formRaw, 60),
      activity: S(pick(st, ['activity', 'activities', 'businessActivity', 'purpose', 'نشاط']), 600),
      capital: digits(pick(st, ['capital', 'capitalAmount', 'رأسالمال', 'رأس'])),
      total: digits(pick(r, ['grandTotal', 'total', 'totalPrice', 'netTotal', 'الإجمالي', 'اجمالي'])),
      addons: addons
    };
  }

  var A = {
    /* ---------- العميل ---------- */
    'client.get': function (p) { var f = fileForClient(p); if (markSeen(f, 'client')) f = fileById(f.id); return bundle(f, false); },
    'client.poll': function (p) {
      var id = cache.get('a_' + S(p.token, 80) + '_' + normCode(p.code));
      var st = id ? cache.get('s_' + id) : null;
      if (st) return { stamp: st };
      var f = fileForClient(p); cache.put('s_' + f.id, String(f.updated), 21600);
      return { stamp: String(f.updated) };
    },
    'client.send': function (p) {
      var f = fileForClient(p), text = S(p.text, 4000);
      if (!text) throw new Error('اكتب الرسالة أولًا.');
      addMsg(f, { senderType: 'client', sender: f.client, text: text });
      touch(f.id); return bundle(fileById(f.id), false);
    },
    'client.saveData': function (p) {
      var f = fileForClient(p);
      var d = mergeData(readData(f), p.data || {}, false, f, f.client);
      store.patch('files', f.id, { data: JSON.stringify(d) });
      addMsg(f, { senderType: 'system', sender: f.client, text: 'قام العميل بتحديث بيانات الشركة.' });
      touch(f.id); return bundle(fileById(f.id), false);
    },
    'client.request': function (p) {
      var f = fileForClient(p), title = S(p.title, 300);
      if (!title) throw new Error('اكتب الطلب أولًا.');
      store.insert('reqs', { id: util.id(), fileId: f.id, title: title, owner: 'office', status: 'مفتوح', note: S(p.note, 600), createdAt: util.now(), doneAt: '', by: f.client });
      addMsg(f, { senderType: 'system', sender: f.client, text: 'طلب جديد من العميل: ' + title });
      touch(f.id); return bundle(fileById(f.id), false);
    },
    'client.upload': function (p) {
      var f = fileForClient(p);
      saveUpload(f, p, f.client, 'client', 'client');
      touch(f.id); return bundle(fileById(f.id), false);
    },
    'client.file': function (p) { return readDoc(fileForClient(p), p.docId); },

    /* ---------- الفريق ---------- */
    'team.login': function (p) { var m = member(p); cache.remove('f_t' + m.name); return { name: m.name, role: m.role, baseUrl: util.baseUrl() }; },
    'team.listPoll': function (p) { memberFast(p); return { stamp: cache.get('ls') || '0' }; },
    'team.list': function (p) {
      member(p);
      var files = store.rows('files'), steps = store.rows('steps'), reqs = store.rows('reqs'), msgs = store.rows('msgs');
      var list = files.map(function (f) {
        var st = steps.filter(function (s) { return s.fileId === f.id; }).sort(byOrder);
        var done = st.filter(function (s) { return s.status === 'تمت'; }).length;
        var cur = st.filter(function (s) { return s.status !== 'تمت'; })[0];
        var rq = reqs.filter(function (r) { return r.fileId === f.id && r.status !== 'تم'; });
        var cm = msgs.filter(function (m) { return m.fileId === f.id && m.channel === 'client'; }).sort(byTs);
        var last = cm[cm.length - 1], unread = 0;
        for (var i = cm.length - 1; i >= 0; i--) { if (cm[i].senderType === 'team') break; if (cm[i].senderType === 'client' && N(cm[i].ts) > N(f.seenTeam)) unread++; }
        var waiting = false;
        for (var j = cm.length - 1; j >= 0; j--) { if (cm[j].senderType === 'system') continue; waiting = cm[j].senderType === 'client'; break; }
        return {
          id: f.id, client: f.client, company: f.company, service: f.service, phone: f.phone, code: f.code, token: f.token,
          status: f.status || 'جارٍ', collected: T(f.collected), delivered: T(f.delivered), updated: N(f.updated),
          total: st.length, done: done, stage: cur ? stageLabel(cur.stage) : 'اكتملت الخطوات', current: cur ? cur.title : '',
          waitClient: rq.filter(function (r) { return r.owner === 'client'; }).length,
          waitOffice: rq.filter(function (r) { return r.owner === 'office'; }).length,
          clientWaiting: waiting, unread: unread,
          lastText: last ? (last.fileName ? 'مستند: ' + last.fileName : last.text) : '', lastFrom: last ? last.senderType : '', lastTs: last ? N(last.ts) : N(f.createdAt)
        };
      }).sort(function (a, b) { return b.lastTs - a.lastTs; });
      return { files: list, stamp: cache.get('ls') || '0' };
    },
    'team.quotes': function (p) {
      member(p);
      var used = {}; store.rows('files').forEach(function (r) { if (r.quoteId) used[r.quoteId] = r.id; });
      var list = (quotes ? quotes.list() : []).map(quoteInfo).filter(function (q) { return !used[q.qid] && (q.client || q.company); });
      list.sort(function (a, b) { return (b.approved - a.approved) || (b.updatedAt - a.updatedAt); });
      return { quotes: list.slice(0, 60) };
    },

      '<span class="end"><span class="num">' + esc(listTime(f.lastTs)) + '</span>' + (f.unread ? '<span class="badge num">' + nf(f.unread) + '</span>' : '') + '</span></button>';
  }).join('') || '<div class="empty">' + (S.list.length ? 'لا توجد نتائج مطابقة.' : 'لا توجد ملفات بعد. افتحي أول ملف من زر الإضافة.') + '</div>';

/* ---------- conversation ---------- */
function setBundle(b) { S.b = b; S.stamp = b.stamp; if (S.mode === 'client') S.fileId = b.file.id; }
function openFile(id, invite) {
  S.fileId = id; S.b = null; S.dirty = false; S.draft = null; S.lastMsgId = '';
  var sh = $('#shell'); if (sh) sh.classList.add('in-conv');
  $('#chead').hidden = false; $('#cmp').hidden = true;
  $('#chead').innerHTML = '<div class="r1"><span class="av s"> </span><div class="ttl"><b>جارٍ التحميل…</b><span>&nbsp;</span></div></div>';
  $('#panel').innerHTML = '<div class="sk" style="width:60%"></div><div class="sk" style="width:45%;align-self:flex-end"></div><div class="sk" style="width:70%"></div>';
  fit(); if (S.mode === 'team') renderList();
  rpc(act('get'), auth({ fileId: id })).then(function (b) {
    if (S.mode === 'team' && S.fileId !== id) return;
    setBundle(b); renderConv(); startPoll(); if (invite) inviteDialog();
    if (S.mode === 'team') { var it = S.list.filter(function (f) { return f.id === id; })[0]; if (it && it.unread) { it.unread = 0; renderList(); } }
  }).catch(function (e) { if (S.mode === 'client') showClientLogin(e.message); else toast(e.message); });
}
function fit() {
  var c = $('#conv'); if (!c) return;

  c.style.setProperty('--bot', (m && !m.hidden ? m.offsetHeight : 0) + 'px');
}
window.addEventListener('resize', fit);
function renderConv() { renderHead(); renderPanel(); }
function renderHead() {
  var b = S.b, f = b.file, team = S.mode === 'team';

  var cur = b.steps.filter(function (s) { return s.status !== 'تمت'; })[0];

  var sub = team ? f.client + ' · ' + f.service : (cur ? 'الخطوة الحالية: ' + cur.title : 'اكتملت خطوات الملف');
  var T = [['chat', 'المحادثة', 0], ['track', 'المتابعة', !team ? need : 0], ['data', 'البيانات', 0], ['docs', 'المستندات', b.docs.length]];

    '<span class="av s">' + esc(team ? initial(f.company || f.client) : 'م.س') + '</span>' +
    '<div class="ttl"><b>' + esc(team ? (f.company || f.client) : 'مكتب محمود سالم') + '</b><span>' + esc(sub) + '</span></div>' +
    '<span class="chip c-gold num">' + nf(done) + '/' + nf(b.steps.length) + '</span>' +
    (team ? '<button class="ib" id="h_key" title="رابط العميل ورمزه" aria-label="رابط العميل ورمزه">' + I.key + '</button>' : '<button class="ib" id="h_out" title="خروج" aria-label="خروج">' + I.out + '</button>') + '</div>' +
    '<div class="seg tabs" role="tablist">' + T.map(function (t) { return '<button role="tab" data-tab="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + t[1] + (t[2] ? ' <span class="dot num">' + nf(t[2]) + '</span>' : '') + '</button>'; }).join('') + '</div>';
  var bk = $('#h_back'); if (bk) bk.onclick = function () { $('#shell').classList.remove('in-conv'); S.fileId = ''; S.b = null; renderList(); };
  var k = $('#h_key'); if (k) k.onclick = inviteDialog;
  var o = $('#h_out'); if (o) o.onclick = logout;
  $$('[data-tab]').forEach(function (bt) { bt.onclick = function () {
    if (S.tab === 'data' && S.dirty && bt.dataset.tab !== 'data') S.draft = collectData();
    S.tab = bt.dataset.tab; S.lastMsgId = ''; renderConv(); }; });
  fit();
}
function renderPanel() {
  $('#cmp').hidden = S.tab !== 'chat';
  ({ chat: panelChat, track: panelTrack, data: panelData, docs: panelDocs })[S.tab]();
  fit();
}
function mutate(name, payload, okMsg, btn) {
  if (btn) btn.disabled = true;
  return rpc(act(name), auth(Object.assign({ fileId: S.fileId }, payload))).then(function (b) {
    setBundle(b); renderConv(); if (okMsg) toast(okMsg);
  }).catch(function (e) { toast(e.message); if (btn) btn.disabled = false; });
}

/* ---- chat ---- */
function panelChat() {
  var team = S.mode === 'team', internal = team && S.channel === 'internal';
  $('#panel').innerHTML = (team ? '<span class="seg chan" role="group" aria-label="القناة"><button data-ch="client" aria-pressed="' + !internal + '">مع العميل</button><button data-ch="internal" aria-pressed="' + internal + '">داخلية للفريق</button></span>' : '') +
    (internal ? '<span class="note-int">قناة داخلية: لا تظهر للعميل</span>' : '') + '<div class="msgs' + (internal ? ' internal' : '') + '" id="msgs"></div>';
  $$('[data-ch]').forEach(function (b) { b.onclick = function () { S.channel = b.dataset.ch; S.lastMsgId = ''; panelChat(); fit(); }; });
  var cmp = $('#cmp');
  if (!cmp.dataset.ready) {
    cmp.innerHTML = '<div><label class="ib" title="إرفاق ملف" aria-label="إرفاق ملف">' + I.clip + '<input type="file" id="cfile" hidden></label>' +
      '<textarea class="inp" id="ctext" rows="1" aria-label="نص الرسالة"></textarea><button class="ib gold" type="submit" aria-label="إرسال">' + I.send + '</button></div>';
    cmp.dataset.ready = '1';

    ta.onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); cmp.requestSubmit(); } };
    cmp.onsubmit = function (e) { e.preventDefault(); sendMsg(); };

}
function sendMsg() {
  var ta = $('#ctext'), t = ta.value.trim(); if (!t || !S.b) return;
  var tmp = { id: 'tmp' + Date.now(), channel: S.mode === 'team' ? S.channel : 'client', senderType: S.mode, sender: S.mode === 'team' ? S.tname : S.b.file.client, text: t, ts: Date.now(), pending: true };
  S.b.msgs.push(tmp); ta.value = ''; ta.style.height = ''; fit(); renderMsgs(true); S.sending++;
  var fid = S.fileId;
  rpc(act('send'), auth({ fileId: fid, text: t, channel: tmp.channel })).then(function (b) {
    if (S.fileId !== fid) return;
    var pend = S.b.msgs.filter(function (m) { return m.pending && m !== tmp; });
    setBundle(b); pend.forEach(function (m) { S.b.msgs.push(m); });
    S.lastMsgId = 'none'; if (S.tab === 'chat') { S.lastMsgId = ''; renderMsgs(true); }
  }).catch(function (e) {
    toast(e.message); var i = S.b ? S.b.msgs.indexOf(tmp) : -1; if (i > -1) S.b.msgs.splice(i, 1);

}
function renderMsgs(force) {
  var box = $('#msgs'), sc = $('#scroll'); if (!box) return;

  var atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 90;
  var list = S.b.msgs.filter(function (m) { return m.channel === ch; });
  var seenAt = team ? f.seenClient : f.seenTeam, lastDay = '', prev = null, known = S.lastMsgId;
  var kIdx = -1, html = '';
  if (known) list.forEach(function (m, i) { if (m.id === known) kIdx = i; });
  list.forEach(function (m, i) {
    var dk = dayKey(m.ts);
    if (dk !== lastDay) { html += '<div class="day">' + dayLabel(m.ts) + '</div>'; lastDay = dk; prev = null; }
    var isNew = kIdx > -1 && i > kIdx ? ' new' : '';
    if (m.senderType === 'system') { html += '<div class="sys' + isNew + '">' + esc(m.text) + '</div>'; prev = null; return; }
    var me = team ? (m.senderType === 'team' && m.sender === S.tname) : m.senderType === 'client';
    var same = prev && prev.senderType === m.senderType && prev.sender === m.sender;
    var body = m.fileName ? '<button type="button" class="att" data-doc="' + esc(m.docId) + '"><span class="ext">' + esc(ext(m.fileName)) + '</span><span>' + esc(m.fileName) + '</span></button>' : '<div class="txt">' + esc(m.text) + '</div>';
    var tick = '';

      '<div class="tm num">' + tick + '<span>' + fmtT.format(m.ts) + '</span></div></div>';
    prev = m;
  });

  S.lastMsgId = list.length ? list[list.length - 1].id : 'none';

/* ---- track ---- */
function panelTrack() {
  var b = S.b, f = b.file, team = S.mode === 'team';
  var need = b.reqs.filter(function (r) { return r.owner === 'client' && r.status !== 'تم'; });
  var doneClient = b.reqs.filter(function (r) { return r.owner === 'client' && r.status === 'تم'; });
  var office = b.reqs.filter(function (r) { return r.owner === 'office'; });
  function reqRow(r, cls) {
    var right = team ? '<select class="inp" style="width:auto;padding:5px 10px;font-size:13px;border-radius:999px" data-req="' + esc(r.id) + '" aria-label="حالة الطلب">' +

    (team ? '<form class="addform" id="addNeed"><input class="inp" id="need_t" placeholder="مطلوب من العميل، مثل: توكيل رسمي" aria-label="مطلوب جديد"><button class="btn sm primary">إضافة</button></form>' : '') + '</div>';

  html += '<div class="card glass"><div class="card-h"><h2>خطوات الملف</h2><span class="muted small">' + (team ? 'اضغطي الدائرة لتغيير الحالة' : 'تُحدَّث مع كل إجراء') + '</span></div><ul class="steps">';
  b.stages.forEach(function (s) {
    var st = b.steps.filter(function (x) { return x.stage === s.key; }); if (!st.length) return;
    html += '<li class="sl">' + esc(s.label) + '</li>';
    st.forEach(function (x) {
      var cls = x.status === 'تمت' ? 'done' : x.status === 'جارية' ? 'doing' : '';
      var mark = team ? '<button class="mark ' + cls + '" data-step="' + esc(x.id) + '" aria-label="تغيير حالة: ' + esc(x.title) + '">✓</button>' : '<span class="mark ' + cls + '">✓</span>';
      html += '<li>' + mark + '<div style="flex:1;min-width:0"><div class="st-t ' + cls + '">' + esc(x.title) + '</div><div class="st-m">' +

  $$('[data-req]').forEach(function (sel) { sel.onchange = function () { mutate('req', { id: sel.dataset.req, status: sel.value }, 'تم تحديث الطلب'); }; });

    if (team) mutate('req', { title: t, owner: 'office', status: 'مفتوح' }, 'أُضيف الطلب'); else mutate('request', { title: t }, 'وصل طلبكم إلى المكتب'); };
}

/* ---- data ---- */

}

function panelDocs() {

    '<div class="row">' + (team ? '<button class="btn sm" id="sync">مزامنة من درايف</button>' : '') + '<label class="btn gold sm">اختيار ملف<input type="file" id="dfile" hidden multiple></label></div></div></div>' +
    '<div class="card glass"><div class="card-h"><h2>مستندات الملف</h2><span class="muted small num">' + nf(docs.length) + ' مستند</span></div>' +
    (docs.map(function (d) {
      return '<div class="doc"><span class="ext">' + esc(ext(d.name)) + '</span><div style="flex:1;min-width:0"><div class="nm">' + esc(d.name) + '</div><div class="small muted">' + fmtD.format(d.ts) + ' · ' + size(d.size) + (d.by ? ' · ' + esc(d.by) : '') + '</div></div><button class="btn sm" data-doc="' + esc(d.id) + '">تنزيل</button></div>';
    }).join('') || '<div class="empty">لم تُرفع مستندات بعد.</div>') + '</div>';
  $('#dfile').onchange = function () { var fs = Array.prototype.slice.call(this.files); this.value = ''; fs.reduce(function (p, f) { return p.then(function () { return upload(f, 'client'); }); }, Promise.resolve()); };
  $$('#panel [data-doc]').forEach(function (b) { b.onclick = function () { openDoc(b.dataset.doc); }; });
  var sy = $('#sync'); if (sy) sy.onclick = function () { mutate('syncDocs', {}, 'تمت المزامنة', sy); };
}
function upload(file, channel) {
  if (!file) return Promise.resolve();
  if (file.size > 10 * 1024 * 1024) { toast('الملف أكبر من ١٠ ميجابايت.'); return Promise.resolve(); }
  toast('جارٍ رفع «' + file.name + '»…');
  return new Promise(function (res) {
    var r = new FileReader();
    r.onload = function () {
      rpc(act('upload'), auth({ fileId: S.fileId, name: file.name, mime: file.type, b64: String(r.result).split(',')[1] || '', channel: channel || 'client' }))
        .then(function (b) { setBundle(b); S.lastMsgId = ''; renderConv(); toast('رُفع «' + file.name + '»'); }).catch(function (e) { toast(e.message); }).then(res);
    };
    r.onerror = function () { toast('تعذّرت قراءة الملف.'); res(); };
    r.readAsDataURL(file);
  });
}
function openDoc(docId) {
  if (!docId) return;
  if (!LIVE) { toast('التنزيل يعمل في النسخة الفعلية بعد التحقق من صاحب الملف.'); return; }
  toast('جارٍ تجهيز المستند…');
  rpc(act('file'), auth({ fileId: S.fileId, docId: docId })).then(function (r) {
    var bin = atob(r.b64), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([u8], { type: r.mime || 'application/octet-stream' }));
    var a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }).catch(function (e) { toast(e.message); });
}

/* ---------- polling ---------- */
var pollT = null;
function stopPoll() { if (pollT) clearInterval(pollT); pollT = null; }
function startPoll() {
  stopPoll();
  pollT = setInterval(function () {
    if (document.hidden) return;
    if (S.mode === 'team') rpc('team.listPoll', auth()).then(function (r) { if (r.stamp !== S.listStamp) loadList(); }).catch(function () {});
    if (!S.b || S.sending) return;
    var fid = S.fileId;
    rpc(act('poll'), auth({ fileId: fid })).then(function (r) {
      if (r.stamp === S.stamp || S.sending || S.fileId !== fid) return;
      return rpc(act('get'), auth({ fileId: fid })).then(function (b) {
        if (S.fileId !== fid || S.sending) return;
        setBundle(b);
        var ae = document.activeElement, busy = ae && $('#panel').contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName);
        if (S.tab === 'chat') { renderHead(); renderMsgs(false); }
        else if (S.tab === 'data') { if (!S.dirty && !busy) renderConv(); }
        else if (!busy && !document.querySelector('dialog[open]')) renderConv();
      });
    }).catch(function () {});
  }, LIVE ? 4000 : 3000);
}

/* ---------- boot ---------- */
function boot(params) {
  params = params || {};
  if (!LIVE) { S.mode = 'client'; S.token = Mock.demoClient.token; S.code = Mock.demoClient.code; demoBar(); clientShell(); return; }
  if (params.f) {
    S.mode = 'client'; S.token = String(params.f); S.code = load('pc_' + S.token) || '';
    if (!S.code) return showClientLogin();
    return rpc('client.get', auth()).then(function (b) { clientShell(b); }).catch(function () { showClientLogin(); });
  }
  S.mode = 'team';
  var saved = null; try { saved = JSON.parse(load('pt') || 'null'); } catch (e) {}
  if (!saved) return showTeamLogin();
  S.tname = saved.n; S.tcode = saved.c;
  rpc('team.login', auth()).then(function (m) { S.baseUrl = API ? portalUrl() : m.baseUrl; teamShell(); }).catch(function () { showTeamLogin(); });
}
if (GAS) google.script.url.getLocation(function (loc) { boot(loc.parameter || {}); });
else if (API) { var qp = {}; new URLSearchParams(location.search).forEach(function (v, k) { qp[k] = v; }); boot(qp); }
else if (API === '') $('#app').innerHTML = '<div class="gate gut"><div class="card glass"><span class="av">م.س</span><h1 style="font-size:19px">لم يُضبط رابط الخادم بعد</h1><p class="muted small" style="margin:0">ضعي رابط تطبيق Apps Script داخل ملف config.js ثم احفظي التعديل.</p></div></div>';
else boot();
</script>
